name: Android build and release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK variants to build
        required: true
        default: both
        type: choice
        options: [debug, release, both]
      publish_release:
        description: Publish a GitHub Release (tags only)
        required: true
        default: false
        type: boolean

# Required for creating a GitHub Release on a version tag. Pull requests receive
# a read-only token, so this does not grant write access to untrusted code.
permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
  # Turn off analytics and improve reproducibility for non-interactive CI.
  CI: "true"

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | "$sdkmanager" --licenses >/dev/null

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create local configuration file
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .env.example ]]; then
            cp .env.example .env
          else
            : > .env
          fi

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FloWave CI Debug,O=FloWave,C=US"

      # Optional repository secrets for a distributable, release-signed APK:
      # KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Restore release signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are unavailable; the release APK will use the CI debug key."
          fi

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
        continue-on-error: true

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.available == 'true' && format('{0}/release.keystore', github.workspace) || '' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect APKs and reports
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts/apk ci-artifacts/reports
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} ci-artifacts/apk/ \; || true
          find app/build/reports -type f \( -name '*.html' -o -name '*.xml' \) -exec cp --parents {} ci-artifacts/reports/ \; || true
          find app/build/test-results -type f -name '*.xml' -exec cp --parents {} ci-artifacts/reports/ \; || true

      - name: Write artifact manifest
        if: always()
        shell: bash
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.available }}
        run: |
          set -uo pipefail
          {
            echo "# FloWave build artifacts"
            echo
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Release signing credentials available: `${SIGNED_RELEASE}`"
            echo "- APK checksums:"
            if compgen -G 'ci-artifacts/apk/*.apk' > /dev/null; then
              (cd ci-artifacts/apk && sha256sum *.apk)
            else
              echo "  - No APK was produced. Inspect the workflow logs."
            fi
          } > ci-artifacts/README.md

      - name: Upload debug APK
        if: always()
        id: debug-apk
        uses: actions/upload-artifact@v4
        with:
          name: FloWave-debug-${{ github.run_number }}
          path: |
            ci-artifacts/apk/*debug*.apk
            ci-artifacts/README.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK
        if: always()
        id: release-apk
        uses: actions/upload-artifact@v4
        with:
          name: FloWave-release-${{ github.run_number }}
          path: |
            ci-artifacts/apk/*release*.apk
            ci-artifacts/README.md
          if-no-files-found: warn
          retention-days: 90

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloWave-reports-${{ github.run_number }}
          path: ci-artifacts/reports
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release for a version tag
        if: >-
          success() && startsWith(github.ref, 'refs/tags/v') &&
          (github.event_name == 'push' || inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(ci-artifacts/apk/*release*.apk ci-artifacts/README.md)
          gh release create "$TAG" "${files[@]}" \
            --title "FloWave $TAG" \
            --generate-notes \
            --verify-tag

      - name: Publish artifact download links
        if: always()
        shell: bash
        env:
          DEBUG_ARTIFACT_URL: ${{ steps.debug-apk.outputs.artifact-url }}
          RELEASE_ARTIFACT_URL: ${{ steps.release-apk.outputs.artifact-url }}
        run: |
          cat ci-artifacts/README.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Downloads" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DEBUG_ARTIFACT_URL" ]]; then
            echo "- [Debug APK artifact]($DEBUG_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$RELEASE_ARTIFACT_URL" ]]; then
            echo "- [Release APK artifact]($RELEASE_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
