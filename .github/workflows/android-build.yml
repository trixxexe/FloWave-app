name: Android build and release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK variants to build
        required: true
        default: both
        type: choice
        options: [debug, release, both]
      publish_release:
        description: Publish a GitHub Release (tags only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  GRADLE_VERSION: "9.3.1"
  CI: "true"

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # validate-wrappers MUST be false. The AI Studio scaffold's committed
      # gradle-wrapper.jar is not in Gradle's known-checksums database, so
      # setup-gradle's own internal validation fails before we ever get a
      # chance to regenerate it below. Disabling this check here is safe
      # because we throw away the committed jar and regenerate a fresh one
      # from a real, officially-downloaded Gradle binary in the next step.
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false

      - name: Regenerate Gradle wrapper
        run: |
          gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}
          chmod +x ./gradlew

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Create local configuration file
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .env.example ]]; then
            cp .env.example .env
          else
            : > .env
          fi

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FloWave CI Debug,O=FloWave,C=US"
          fi

      - name: Prepare release signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          IN_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          IN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          IN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$IN_STORE_PASSWORD" && -n "$IN_KEY_ALIAS" && -n "$IN_KEY_PASSWORD" ]]; then
            echo "Using real release signing secrets from repo settings."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$IN_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$IN_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$IN_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release secrets found — generating a fallback CI keystore so the build never breaks."
            keytool -genkeypair -noprompt \
              -keystore "${{ github.workspace }}/release.keystore" \
              -storepass flowaveci \
              -alias flowaveci \
              -keypass flowaveci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=FloWave CI Release,O=FloWave,C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=flowaveci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=flowaveci" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=flowaveci" >> "$GITHUB_ENV"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Collect APKs and reports
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts/apk ci-artifacts/reports
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} ci-artifacts/apk/ \; || true
          find app/build/reports -type f \( -name '*.html' -o -name '*.xml' \) -exec cp --parents {} ci-artifacts/reports/ \; || true
          find app/build/test-results -type f -name '*.xml' -exec cp --parents {} ci-artifacts/reports/ \; || true

      - name: Write artifact manifest
        if: always()
        shell: bash
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.available }}
        run: |
          set -uo pipefail
          {
            echo "# FloWave build artifacts"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Real release signing secrets used: \`${SIGNED_RELEASE}\`"
            echo "- APK checksums:"
            if compgen -G 'ci-artifacts/apk/*.apk' > /dev/null; then
              (cd ci-artifacts/apk && sha256sum *.apk)
            else
              echo "  - No APK was produced. Inspect the workflow logs."
            fi
          } > ci-artifacts/README.md

      - name: Upload debug APK
        if: always()
        id: debug-apk
        uses: actions/upload-artifact@v4
        with:
          name: FloWave-debug-${{ github.run_number }}
          path: |
            ci-artifacts/apk/*debug*.apk
            ci-artifacts/README.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release APK
        if: always()
        id: release-apk
        uses: actions/upload-artifact@v4
        with:
          name: FloWave-release-${{ github.run_number }}
          path: |
            ci-artifacts/apk/*release*.apk
            ci-artifacts/README.md
          if-no-files-found: warn
          retention-days: 90

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FloWave-reports-${{ github.run_number }}
          path: ci-artifacts/reports
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release for a version tag
        if: >-
          success() && startsWith(github.ref, 'refs/tags/v') &&
          (github.event_name == 'push' || inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(ci-artifacts/apk/*release*.apk ci-artifacts/README.md)
          gh release create "$TAG" "${files[@]}" \
            --title "FloWave $TAG" \
            --generate-notes \
            --verify-tag

      - name: Publish artifact download links
        if: always()
        shell: bash
        env:
          DEBUG_ARTIFACT_URL: ${{ steps.debug-apk.outputs.artifact-url }}
          RELEASE_ARTIFACT_URL: ${{ steps.release-apk.outputs.artifact-url }}
        run: |
          cat ci-artifacts/README.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Downloads" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$DEBUG_ARTIFACT_URL" ]]; then
            echo "- [Debug APK artifact]($DEBUG_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$RELEASE_ARTIFACT_URL" ]]; then
            echo "- [Release APK artifact]($RELEASE_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
